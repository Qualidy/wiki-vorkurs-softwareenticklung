title: CSV-Noten auswerten
difficulty: 2
question: |
  Erstelle `noten.csv`:

  ```csv
  Name,Note
  Anna,2
  Bob,3
  Charlie,1
  ```

  Schreibe ein Skript, das:

  1. Alle Einträge ausgibt
  2. Die **beste** (kleinste) Note findet und den Namen ausgibt
solution: |
  ```python
  import csv

  beste_note = 6
  bester_name = ""

  with open("noten.csv", "r", encoding="utf-8") as f:
      reader = csv.DictReader(f)
      for row in reader:
          print(f"{row['Name']}: {row['Note']}")
          note = int(row["Note"])
          if note < beste_note:
              beste_note = note
              bester_name = row["Name"]

  print(f"Beste Note: {bester_name} mit {beste_note}")
  ```
